<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AniLibria Player</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
        #hint {
            position: absolute; width: 180px; height: 56px; margin: -28px 0 0 -90px; border-radius: 28px;
            background: rgba(0, 0, 0, .35); color: rgba(255, 255, 255, .9);
            font: 600 24px/56px -apple-system, sans-serif; text-align: center; display: none;
        }
    </style>
    <script src="//msx.benzac.de/js/tvx-plugin.min.js"></script>
</head>
<body>
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
    <div id="hint"></div>
    <script>
        /* MSX video plugin: draws the video in landscape even while MSX itself stays in portrait. */
        (function () {
            "use strict";

            var HINT_MS = 1000;

            function param(name) {
                var match = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
                return match ? decodeURIComponent(match[1]) : "";
            }

            function layout(video) {
                var width = window.innerWidth;
                var height = window.innerHeight;
                var portrait = height > width;
                video.style.width = portrait ? height + "px" : "100%";
                video.style.height = portrait ? width + "px" : "100%";
                video.style.left = portrait ? (width - height) / 2 + "px" : "0";
                video.style.top = portrait ? (height - width) / 2 + "px" : "0";
                var transform = portrait ? "rotate(90deg)" : "none";
                video.style.transform = transform;
                video.style.webkitTransform = transform;
                var hint = document.getElementById("hint");
                hint.style.transform = transform;
                hint.style.webkitTransform = transform;
            }

            /* Shown over the picture, on the side that was tapped. Portrait turns the picture
               clockwise, so its left edge is at the top of the screen. */
            var hideHintTimer = null;
            var hintSide = 0;
            var hintTotal = 0;

            function showHint(side, seconds) {
                var hint = document.getElementById("hint");
                var portrait = window.innerHeight > window.innerWidth;
                var offset = side > 0 ? "78%" : "22%";
                hintTotal = side === hintSide ? hintTotal + seconds : seconds;
                hintSide = side;
                hint.textContent = (side > 0 ? "+" : "−") + hintTotal + " сек";
                hint.style.left = portrait ? "50%" : offset;
                hint.style.top = portrait ? offset : "50%";
                hint.style.display = "block";
                clearTimeout(hideHintTimer);
                hideHintTimer = setTimeout(function () {
                    hint.style.display = "none";
                    hintSide = 0;
                }, HINT_MS);
            }

            function Player() {
                var video = document.getElementById("video");
                var refit = function () { layout(video); };

                this.init = function () {
                    window.addEventListener("resize", refit);
                    refit();
                    video.addEventListener("waiting", function () { TVXVideoPlugin.startLoading(); });
                    video.addEventListener("playing", function () { TVXVideoPlugin.stopLoading(); });
                    video.addEventListener("ended", function () { TVXVideoPlugin.stopPlayback(); });
                    video.addEventListener("error", function () {
                        TVXVideoPlugin.stopLoading();
                        TVXVideoPlugin.error("Не удалось загрузить видео");
                    });
                    TVXVideoPlugin.startLoading();
                    video.src = param("url");
                    video.load();
                };
                this.ready = function () { TVXVideoPlugin.startPlayback(); };
                this.play = function () {
                    var result = video.play();
                    if (result && result["catch"]) {
                        result["catch"](function () {
                            TVXVideoPlugin.stopLoading();
                            TVXVideoPlugin.warn("Нажми кнопку воспроизведения");
                        });
                    }
                };
                this.pause = function () { video.pause(); };
                this.stop = function () {
                    video.pause();
                    video.removeAttribute("src");
                    video.load();
                };
                this.getDuration = function () { return isFinite(video.duration) ? video.duration : 0; };
                this.getPosition = function () { return video.currentTime; };
                this.setPosition = function (position) { video.currentTime = position; };
                this.setVolume = function (volume) { video.volume = volume / 100; };
                this.getVolume = function () { return Math.round(video.volume * 100); };
                this.setMuted = function (muted) { video.muted = muted; };
                this.isMuted = function () { return video.muted; };
                this.getSpeed = function () { return video.playbackRate; };
                this.setSpeed = function (speed) { video.playbackRate = speed; };
                this.setSize = refit;
                this.handleData = function (data) {
                    var match = data && /^hint:(-?1):(\d+)$/.exec(data.message || "");
                    if (match) { showHint(Number(match[1]), Number(match[2])); }
                };
                this.getUpdateData = function () {
                    return {
                        position: this.getPosition(),
                        duration: this.getDuration(),
                        speed: this.getSpeed()
                    };
                };
            }

            TVXPluginTools.onReady(function () {
                TVXVideoPlugin.setupPlayer(new Player());
                TVXVideoPlugin.init();
            });
        }());
    </script>
</body>
</html>
